# Copy this file to ~/.config/recon-chain.conf
# and edit for your setup.

# Where reports are stored
REPORT_ROOT="$HOME/recon-chain/reports"

# Requests per second (lower = stealthier, higher = faster)
RATE_LIMIT=150

# Crawl depth for katana
DEPTH=3

# Toggle stages (0 = off, 1 = on)
WITH_NUCLEI=1
WITH_FFUF=0
WITH_SQLMAP=0

# Nuclei severity filter
NUCLEI_SEVERITY="critical,high,medium"

# sqlmap settings
SQLMAP_LEVEL=1
SQLMAP_RISK=1

# ffuf wordlist
FFUF_WORDLIST="/usr/share/wordlists/dirb/common.txt"
